description: |-
   The Ibero-Romance Handwriting in Arabic Script dataset comprises 22 extracts from 19 different
    manuscripts. It constitutes a first open and documented ATR dataset for Spanish Ajami better
    known as Aljamiado (Ibero-Romance written in Arabic script). It was curated with the e-Scriptorium interface (https://escriptorium.eu/) which operates on the Kraken engine (https://kraken.re/main/index.html).
