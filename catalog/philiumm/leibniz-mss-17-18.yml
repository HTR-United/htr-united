description: >-
  This dataset provides ground truth data for Handwritten Text Recognition (HTR) of Gottfried
  Wilhelm Leibniz's manuscripts (17th–early 18th century), composed of transcribed and manually
  corrected folios together with automatically aligned ground truth for fine-tuning HTR models. 


  It comprises a manually corrected "clean" subset of 20,139 lines across 275 pages and a "noisy"
  subset of 43,372 lines across 735 pages, produced by aligning existing ground truth with the
  output of the FoNDUE-GD-v2 HTR model (https://doi.org/10.5281/zenodo.14399779).
